<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#149447">
<meta name="description" content="Verdulería Terán — productos frescos directo a tu hogar.">
<title>Verdulería Terán</title>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=8"></script>
<script>
// Limpia cualquier Service Worker/caché antiguo que haya dejado una versión anterior en blanco.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  }).catch(function(){});
}
if (window.caches) {
  caches.keys().then(function(keys){
    return Promise.all(keys.map(function(key){ return caches.delete(key); }));
  }).catch(function(){});
}
</script>
</body>
</html>
