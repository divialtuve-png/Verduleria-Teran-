<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#149447">
  <meta name="description" content="Verdulería Terán — productos frescos directo a tu hogar.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Verdulería Terán</title>
  <link rel="manifest" href="manifest.webmanifest?v=7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥬%3C/text%3E%3C/svg%3E">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=7"></script>
  <script src="app.js?v=7"></script>
  <script>
    // Reemplaza cualquier service worker/caché anterior que pueda estar
    // mostrando una versión vieja del proyecto.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(r => r.unregister()));
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          // Registrar la versión nueva después de limpiar la anterior.
          await navigator.serviceWorker.register('./sw.js?v=7');
        } catch (error) {
          console.warn('No se pudo actualizar el service worker:', error);
        }
      });
    }
  </script>
</body>
</html>
